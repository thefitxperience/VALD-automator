<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>UDRA — Posture Correction Program (reference implementation)</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@200;300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #DAD6CE; font-family: 'Sora', sans-serif; }
  .sheet {
    width: 1056px; height: 816px;      /* 11in x 8.5in @ 96dpi */
    background: #EFECE6; display: flex; overflow: hidden;
    margin: 40px auto; box-shadow: 0 24px 60px rgba(18,38,73,.18);
  }
  @page { size: 11in 8.5in; margin: 0; }
  @media print {
    html, body { background: #FFFFFF; }
    .sheet { margin: 0; box-shadow: none; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script>
/* ------------------------------------------------------------------
   INPUT — replace this object with your algorithm's output.
   Every field here is required; nothing else is read.
------------------------------------------------------------------ */
const PROGRAM = {
  client: { name: "Simon abi ramia", date: "08 SEP 2026" },

  // value/min/max are numbers in `unit`. min/max = the normal range.
  measures: [
    { shortName: "Forward head posture (R)", value: 42.5, unit: "°",   min: 0,   max: 30  },
    { shortName: "Forward head posture (L)", value: 42.7, unit: "°",   min: 0,   max: 30  },
    { shortName: "Shoulder stability",       value: 134.1, unit: "°",  min: 170, max: 180 },
    { shortName: "Shoulder slope (L)",       value: 18.7, unit: "°",   min: 12,  max: 18  },
    { shortName: "Shoulder slope (R)",       value: 16,   unit: "°",   min: 12,  max: 18  },
    { shortName: "Rounded shoulder (R)",     value: 33.8, unit: "°",   min: 0,   max: 42  },
    { shortName: "Rounded shoulder (L)",     value: 35.8, unit: "°",   min: 0,   max: 42  },
    { shortName: "Hip hinge angle",          value: 97.2, unit: "°",   min: 0,   max: 70  },
    { shortName: "Finger to floor",          value: 37.9, unit: " cm", min: -5,  max: 5   },
    { shortName: "Lumbar lordosis (L)",      value: 41.1, unit: "°",   min: 45,  max: 55  },
    { shortName: "Lumbar lordosis (R)",      value: 47,   unit: "°",   min: 45,  max: 55  },
    { shortName: "Thoracic kyphosis (R)",    value: 42.5, unit: "°",   min: 35,  max: 45  },
    { shortName: "Thoracic kyphosis (L)",    value: 42.2, unit: "°",   min: 35,  max: 45  },
    { shortName: "Spinal neutrality",        value: 63.2, unit: "°",   min: 60,  max: 90  },
    { shortName: "Squat depth",              value: 53.7, unit: "°",   min: 60,  max: 150 },
    { shortName: "Pelvic stability",         value: 16.5, unit: "°",   min: 0,   max: 10  },
    { shortName: "Pelvic tilt (L)",          value: 0.2,  unit: "°",   min: -2,  max: 2   },
    { shortName: "Knee extension",           value: 157.8, unit: "°",  min: 170, max: 180 },
    { shortName: "Kendall knee angle (L)",   value: 6.2,  unit: "°",   min: -5,  max: 5   },
    { shortName: "HKA angle (R)",            value: -3.9, unit: "°",   min: -3,  max: 3   },
    { shortName: "Kendall knee angle (R)",   value: 4.9,  unit: "°",   min: -5,  max: 5   },
    { shortName: "HKA angle (L)",            value: -2.3, unit: "°",   min: -3,  max: 3   },
  ],

  // Exactly 3 blocks. `reps` is a string so "10" and "30s" both work.
  blocks: [
    { title: "UPPER BODY & NECK", unitLabel: "sets × reps", items: [
      { name: "Left shrugs", sets: 3, reps: "10" },
      { name: "Chin tucks", sets: 4, reps: "10" },
      { name: "Reverse flys", sets: 2, reps: "10" },
      { name: "Face pull", sets: 2, reps: "10" },
      { name: "External rotation", sets: 2, reps: "10" },
      { name: "Back extensions", sets: 2, reps: "10" },
      { name: "Rowing back", sets: 2, reps: "10" },
      { name: "Lower back extensions", sets: 4, reps: "10" },
      { name: "Bar military press", sets: 4, reps: "10" },
      { name: "Y raises", sets: 4, reps: "10" },
    ]},
    { title: "STRETCHING", unitLabel: "sets × duration", items: [
      { name: "Stretching adductor", sets: 4, reps: "30s" },
      { name: "Stretching chest", sets: 2, reps: "30s" },
      { name: "Cobra pose", sets: 2, reps: "30s" },
      { name: "Stretching shoulder (bent over flexion)", sets: 4, reps: "30s" },
      { name: "Garland pose (hip opening)", sets: 4, reps: "30s" },
      { name: "Hamstring stretching", sets: 4, reps: "30s" },
    ]},
    { title: "LOWER BODY & SPINE", unitLabel: "sets × reps", items: [
      { name: "Right hip hike", sets: 2, reps: "10" },
      { name: "Right hip abduction cable", sets: 4, reps: "10" },
      { name: "Right glute kickbacks", sets: 4, reps: "10" },
      { name: "Hip thrust", sets: 4, reps: "10" },
      { name: "Hip adductions", sets: 4, reps: "10" },
      { name: "Hip abductions", sets: 4, reps: "10" },
      { name: "Leg press full ROM", sets: 4, reps: "10" },
      { name: "Back squats full ROM", sets: 4, reps: "10" },
      { name: "Romanian deadlift", sets: 4, reps: "10" },
      { name: "Stiff leg deadlift", sets: 4, reps: "10" },
    ]},
  ],
};

const C = {
  navy: '#122649', blue: '#005EFF', cyan: '#64E0FF', lime: '#CDFF20',
  red: '#FF403C', redInk: '#C7231F', linen: '#EFECE6', white: '#FFFFFF',
};
const MONO = "'JetBrains Mono',monospace";

/* ------------------------------------------------------------------
   DERIVE — the only computation the sheet performs.
------------------------------------------------------------------ */
const fmt = (x) => (Number.isInteger(x) ? String(x) : x.toFixed(1));

function derive(m) {
  const { value, unit, min, max } = m;
  const ok = value >= min && value <= max;
  const over = value > max, under = value < min;
  const dev = over ? value - max : under ? min - value : 0;

  // Axis spans the union of {normal range, client value}, plus padding, so the
  // dot is always on-bar and the band keeps a visible width.
  const d0 = Math.min(min, value), d1 = Math.max(max, value);
  const pad = Math.max((d1 - d0) * 0.18, Math.max((max - min) * 0.12, 1.5));
  const a = d0 - pad, b = d1 + pad;
  const pct = (x) => ((x - a) / (b - a)) * 100;

  return {
    ...m, ok,
    severity: dev / Math.max(max - min, 1),          // sort key, flagged desc
    valText: fmt(value) + unit,
    rangeText: fmt(min) + ' to ' + fmt(max) + unit.trim(),
    deltaText: ok ? 'in range' : dev.toFixed(1) + unit.trim() + (over ? ' over' : ' under'),
    bandLeft: pct(min).toFixed(1) + '%',
    bandWidth: (pct(max) - pct(min)).toFixed(1) + '%',
    markLeft: pct(value).toFixed(1) + '%',
  };
}

/* ---------------------------------------------------------------- */
const h = (tag, style, children, attrs) => {
  const el = document.createElement(tag);
  if (style) el.style.cssText = style;
  if (attrs) for (const k in attrs) el.setAttribute(k, attrs[k]);
  for (const c of [].concat(children || [])) {
    if (c == null || c === false) continue;
    el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return el;
};

function markerCell(m) {
  return h('div', 'padding:9px 0;border-bottom:1px solid rgba(18,38,73,.13);display:flex;flex-direction:column;gap:6px', [
    h('div', 'display:flex;align-items:baseline;justify-content:space-between;gap:8px', [
      h('div', `font-size:11px;font-weight:600;color:${C.navy};line-height:1.25`, m.shortName),
      h('div', `font-family:${MONO};font-size:12px;font-weight:500;color:${C.redInk};flex-shrink:0`, m.valText),
    ]),
    h('div', 'position:relative;height:5px;background:rgba(18,38,73,.1)', [
      h('div', `position:absolute;top:0;bottom:0;background:${C.blue};left:${m.bandLeft};width:${m.bandWidth}`),
      h('div', `position:absolute;top:-3px;width:11px;height:11px;border-radius:50%;background:${C.red};border:2px solid ${C.linen};margin-left:-5.5px;left:${m.markLeft}`),
    ]),
    h('div', 'display:flex;align-items:baseline;justify-content:space-between;gap:8px', [
      h('div', `font-family:${MONO};font-size:9.5px;color:${C.navy};opacity:.7`, 'NORMAL ' + m.rangeText),
      h('div', `font-family:${MONO};font-size:9.5px;font-weight:500;color:${C.redInk}`, m.deltaText),
    ]),
  ]);
}

function statPair(n, color, l1, l2) {
  return h('div', 'display:flex;align-items:center;gap:14px', [
    h('div', `font-size:58px;font-weight:800;color:${color};line-height:.82;letter-spacing:-.04em`, String(n)),
    h('div', `font-size:10px;font-weight:800;letter-spacing:.14em;color:${C.white};line-height:1.5`, [l1, h('br'), l2]),
  ]);
}

function programmeColumn(b) {
  return h('div', 'flex:1;display:flex;flex-direction:column;min-width:0', [
    h('div', `background:${C.navy};padding:8px 13px;display:flex;align-items:baseline;justify-content:space-between;gap:10px`, [
      h('div', `font-size:10px;font-weight:700;letter-spacing:.1em;color:${C.white}`, b.title),
      h('div', `font-family:${MONO};font-size:9px;color:${C.cyan}`, b.unitLabel),
    ]),
    h('div', `background:${C.white};padding:3px 13px 5px`, b.items.map((e) =>
      h('div', 'display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5.5px 0;border-bottom:1px solid rgba(18,38,73,.08)', [
        h('div', `font-size:10.5px;color:${C.navy};line-height:1.25`, e.name),
        h('div', `font-family:${MONO};font-size:10px;font-weight:500;color:${C.blue};flex-shrink:0`, e.sets + ' × ' + e.reps),
      ]))),
  ]);
}

function render(data) {
  const all = data.measures.map(derive);
  const flagged = all.filter((m) => !m.ok).sort((x, y) => y.severity - x.severity);
  const cleared = all.filter((m) => m.ok);

  const rail = h('div', `width:272px;flex-shrink:0;background:${C.navy};padding:30px 28px;display:flex;flex-direction:column;gap:26px`, [
    h('img', 'width:81px;height:26px;display:block;align-self:flex-start;object-fit:contain', null,
      { src: 'assets/udra-wordmark-white.png', alt: 'UDRA' }),
    h('div', 'display:flex;flex-direction:column;gap:7px', [
      h('div', `font-size:9px;font-weight:700;letter-spacing:.09em;color:${C.cyan};white-space:nowrap`, 'POSTURE CORRECTION PROGRAM'),
      h('div', `font-size:29px;font-weight:700;letter-spacing:-.025em;color:${C.white};line-height:1.08`, data.client.name),
      h('div', `font-family:${MONO};font-size:10px;color:${C.cyan};padding-top:2px`, data.client.date),
    ]),
    h('div', 'height:1px;background:rgba(255,255,255,.2)'),
    h('div', 'display:flex;flex-direction:column;gap:18px', [
      statPair(flagged.length, C.red, 'OUT OF', 'RANGE'),
      statPair(cleared.length, C.lime, 'WITHIN', 'RANGE'),
    ]),
    h('div', 'height:1px;background:rgba(255,255,255,.2)'),
    h('div', 'display:flex;flex-direction:column;gap:5px', [
      h('div', `font-family:${MONO};font-size:10px;color:${C.white};opacity:.85`, all.length + ' markers assessed'),
      h('div', `font-family:${MONO};font-size:10px;color:${C.white};opacity:.85`,
        data.blocks.reduce((n, b) => n + b.items.length, 0) + ' exercises prescribed'),
    ]),
    h('div', 'margin-top:auto;display:flex;flex-direction:column;gap:12px', [
      h('img', 'width:26px;height:26px;display:block;align-self:flex-start;object-fit:contain', null,
        { src: 'assets/udra-mark-white.png', alt: '' }),
      h('div', `font-size:9.5px;font-weight:600;letter-spacing:.18em;color:${C.white};opacity:.78`, 'UDRA PERFORMANCE'),
    ]),
  ]);

  const field = h('div', 'flex:1;padding:28px 32px;display:flex;flex-direction:column;gap:13px;min-width:0', [
    h('div', `display:flex;align-items:baseline;justify-content:space-between;gap:10px;border-bottom:1.5px solid ${C.navy};padding-bottom:7px`, [
      h('div', `font-size:17px;font-weight:700;color:${C.navy};letter-spacing:-.015em`, 'Priority findings'),
      h('div', `font-size:9px;font-weight:600;letter-spacing:.12em;color:${C.navy};opacity:.72`, 'MEASURED VALUE VS NORMAL RANGE'),
    ]),
    h('div', 'display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 22px', flagged.map(markerCell)),
    h('div', `background:${C.white};padding:10px 14px;display:flex;flex-direction:column;gap:8px`, [
      h('div', 'display:flex;align-items:center;gap:8px', [
        h('div', `width:7px;height:7px;border-radius:50%;background:${C.blue}`),
        h('div', `font-size:10px;font-weight:700;letter-spacing:.12em;color:${C.navy}`, 'WITHIN RANGE · ' + cleared.length),
      ]),
      h('div', 'display:grid;grid-template-columns:1fr auto 1fr auto 1fr auto;gap:4px 16px',
        cleared.flatMap((m) => [
          h('div', `font-size:10.5px;color:${C.navy};opacity:.8;line-height:1.3`, m.shortName),
          h('div', `font-family:${MONO};font-size:10px;font-weight:500;color:${C.navy};text-align:right`, m.valText),
        ])),
    ]),
    h('div', 'margin-top:auto;display:flex;flex-direction:column;gap:13px', [
      h('div', `display:flex;align-items:baseline;justify-content:space-between;gap:10px;border-bottom:1.5px solid ${C.navy};padding-bottom:7px`, [
        h('div', `font-size:17px;font-weight:700;color:${C.navy};letter-spacing:-.015em`, 'The Program'),
        h('div', `font-size:9px;font-weight:600;letter-spacing:.12em;color:${C.navy};opacity:.72`,
          data.blocks.reduce((n, b) => n + b.items.length, 0) + ' EXERCISES'),
      ]),
      h('div', 'display:flex;gap:14px;align-items:flex-start', data.blocks.map(programmeColumn)),
    ]),
  ]);

  return h('div', null, [rail, field], { class: 'sheet' });
}

document.getElementById('root').appendChild(render(PROGRAM));
</script>
</body>
</html>
